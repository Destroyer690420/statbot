services:
  # Bot + API (single container)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reddit-task-manager
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    volumes:
      - insight-uploads:/app/uploads
      # Playwright persistent Chromium profile (GoPartTime cookies + Vercel
      # challenge clearance survive image rebuilds)
      - browser-profile:/app/.goparttime/browser-profile
    networks:
      - app-network

  # Redis (for BullMQ job queue)
  redis:
    image: redis:7-alpine
    container_name: rtm-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --save "" --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - app-network

  # Dashboard (React frontend)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: rtm-dashboard
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/letsencrypt:/var/www/letsencrypt:ro
    depends_on:
      - app
    networks:
      - app-network

  # Isolated sidecar browser (IndiaMART tabs + noVNC viewer). Deliberately
  # SECONDARY: hard-capped at 1536m with oom_score_adj 500 (it dies first,
  # never the bot) and quarter CPU shares (full speed when idle, yields under
  # contention). No ports published — reachable only via nginx /browser/.
  # No depends_on in either direction: bot and browser never block each other.
  browser:
    build:
      context: ./browser
      dockerfile: Dockerfile
    container_name: rtm-browser
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BROWSER_START_URLS=https://seller.indiamart.com/bltxn/?pref=recent https://seller.indiamart.com/bltxn/?pref=relevant
    mem_limit: 1536m
    mem_reservation: 1024m
    memswap_limit: 1536m
    oom_score_adj: 500
    cpu_shares: 256
    volumes:
      - browser-box:/home/chrome
    networks:
      - app-network

volumes:
  insight-uploads:
  browser-profile:
  browser-box:
  redis-data:

networks:
  app-network:
    driver: bridge
